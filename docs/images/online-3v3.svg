<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>3 vs 3 online: six people, one host</title>
  <rect width="760" height="360" rx="14" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">3 vs 3 online: up to six people, one host</text>

  <!-- Home side -->
  <rect x="24" y="64" width="210" height="232" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="129" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4fae">Home</text>
  <g font-size="14" fill="#1b1f24">
    <rect x="44" y="108" width="170" height="44" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
    <text x="129" y="135" text-anchor="middle">Seat 1 · the host</text>
    <rect x="44" y="164" width="170" height="44" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
    <text x="129" y="191" text-anchor="middle">Seat 2 · a friend</text>
    <rect x="44" y="220" width="170" height="44" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-dasharray="5 4"/>
    <text x="129" y="247" text-anchor="middle">Seat 3 · or the CPU</text>
  </g>

  <!-- Away side -->
  <rect x="526" y="64" width="210" height="232" rx="12" fill="#fff1ec" stroke="#d8603b" stroke-width="2"/>
  <text x="631" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#ae3d1f">Away</text>
  <g font-size="14" fill="#1b1f24">
    <rect x="546" y="108" width="170" height="44" rx="8" fill="#ffffff" stroke="#d8603b"/>
    <text x="631" y="135" text-anchor="middle">Seat 4 · a friend</text>
    <rect x="546" y="164" width="170" height="44" rx="8" fill="#ffffff" stroke="#d8603b"/>
    <text x="631" y="191" text-anchor="middle">Seat 5 · a friend</text>
    <rect x="546" y="220" width="170" height="44" rx="8" fill="#ffffff" stroke="#d8603b" stroke-dasharray="5 4"/>
    <text x="631" y="247" text-anchor="middle">Seat 6 · or the CPU</text>
  </g>

  <!-- Host in the middle -->
  <rect x="282" y="120" width="196" height="120" rx="12" fill="#f4f6f8" stroke="#57606a" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">The host's game</text>
  <text x="380" y="176" text-anchor="middle" font-size="13" fill="#424a53">shares a join code</text>
  <text x="380" y="196" text-anchor="middle" font-size="13" fill="#424a53">checks every machine</text>
  <text x="380" y="216" text-anchor="middle" font-size="13" fill="#424a53">UDP port 7375</text>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M234 180 H282"/>
    <path d="M478 180 H526"/>
  </g>

  <text x="380" y="328" text-anchor="middle" font-size="13" fill="#424a53">Each machine plays at once and corrects itself when the host's frames arrive (rollback).</text>
</svg>
