[package]
name = "street-game"
description = "Streetball Revival's game: the street-sim game rendered with street-render"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
street-assets = { path = "../street-assets" }
street-audio = { path = "../street-audio" }
street-render = { path = "../street-render" }
street-net = { path = "../street-net" }
street-sim = { path = "../street-sim" }
street-video = { path = "../street-video" }
# The OS clipboard: join codes pasted in and copied out.
bevy = { version = "0.20.0", features = ["system_clipboard"] }
igd-next = { version = "0.18.0", default-features = false, features = ["io_sync"] }

# PlayStation pads read from their HID reports (`sony_hid`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
serde_json = "1"
# Tests that run without a disc play the rules' stand-ins.
street-net = { path = "../street-net", features = ["stand-ins"] }
street-sim = { path = "../street-sim", features = ["stand-ins"] }
