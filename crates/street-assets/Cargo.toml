[package]
name = "street-assets"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Animation sampling (`clip`), shared with Bevy (the same crate and math):
# std's maths, as Bevy's build of it uses.
glam = { version = "0.33.12", default-features = false, features = ["std"] }
nod = "1.4.3"
sha2 = "0.10"
# The player editor's roster.json (`roster_edits`).
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
png = "0.18"
# The shared roster of an online match (`roster_share`).
miniz_oxide = "0.8"

[dev-dependencies]
