name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform's failure leaves the other's download standing.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            launcher: StreetballRevival.exe
            binary: street-game.exe
            server: street-server.exe
            export: street-export.exe
          - os: ubuntu-latest
            platform: linux
            launcher: StreetballRevival
            binary: street-game
            server: street-server
            export: street-export
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
          libgtk-3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p street-launcher -p street-game -p street-server -p street-export
      - run: cargo test --workspace
      - run: python tools/publish_check.py
      - name: Gather the release folder
        shell: pwsh
        run: |
          # The launcher and START HERE alone at the top; the programs it
          # starts in bin, the papers in docs.
          $dir = 'dist/Streetball Revival'
          New-Item -ItemType Directory -Path "$dir/bin", "$dir/docs"
          Copy-Item -LiteralPath 'target/release/${{ matrix.launcher }}' -Destination $dir
          Copy-Item -LiteralPath 'docs/START_HERE.txt' -Destination "$dir/START HERE.txt"
          Copy-Item -LiteralPath 'target/release/${{ matrix.binary }}', 'target/release/${{ matrix.server }}', 'target/release/${{ matrix.export }}' -Destination "$dir/bin"
          Copy-Item -LiteralPath 'README.md', 'LEGAL.md', 'LICENSE' -Destination "$dir/docs"
          Copy-Item -LiteralPath 'docs/PLAYING.md' -Destination "$dir/docs/HOW TO PLAY ONLINE.md"
      - name: Zip the release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path 'dist/Streetball Revival' -DestinationPath 'streetball-revival-${{ github.ref_name }}-${{ matrix.platform }}.zip'
      - name: Zip the release (Linux, keeping the programs runnable)
        if: matrix.os == 'ubuntu-latest'
        run: cd dist && zip -r '../streetball-revival-${{ github.ref_name }}-${{ matrix.platform }}.zip' 'Streetball Revival'
      - name: The one-file game (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:STREET_GAME_EMBED = "$PWD/target/release/${{ matrix.binary }}"
          cargo build --release -p street-launcher
          Copy-Item -LiteralPath 'target/release/${{ matrix.launcher }}' -Destination 'StreetballRevival-${{ github.ref_name }}-windows.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: streetball-revival-${{ matrix.platform }}
          path: |
            streetball-revival-${{ github.ref_name }}-${{ matrix.platform }}.zip
            StreetballRevival-${{ github.ref_name }}-windows.exe
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Streetball Revival ${{ github.ref_name }} (beta)
          files: |
            StreetballRevival-${{ github.ref_name }}-windows.exe
            streetball-revival-${{ github.ref_name }}-${{ matrix.platform }}.zip
          body_path: .github/RELEASE_NOTES.md
