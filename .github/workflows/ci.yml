name: ci

on:
  push:
  pull_request:

# The checks only read the code.
permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy's system libraries
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libgtk-3-dev
          pkg-config
      # The compiler the project is checked with locally: a newer
      # stable brings new clippy lints (and could change float codegen
      # between builds that play online together).
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python tools/publish_check.py
